<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>澜流 Lanflow · 交互原型</title>
<style>
:root{
  --accent:#007AFF; --green:#34C759; --orange:#FF9500; --red:#FF3B30;
  --text:#1d1d1f; --text2:rgba(0,0,0,.55); --text3:rgba(0,0,0,.3);
  --bg:#f5f5f7; --group:#fff; --sidebar:rgba(226,226,231,.84); --sep:rgba(0,0,0,.09);
  --ctl:#fff; --ctl-border:rgba(0,0,0,.15); --hover:rgba(0,0,0,.045); --sel:rgba(0,0,0,.08);
  --desk:linear-gradient(135deg,#9fb8d6,#c9d6e6 45%,#e8d9cf);
  --shadow:0 22px 70px rgba(0,0,0,.28),0 0 0 .5px rgba(0,0,0,.28);
  --menu:rgba(246,246,248,.94); --accent-soft:rgba(0,122,255,.12);
  --banner-red:rgba(255,59,48,.09); --banner-orange:rgba(255,149,0,.1);
  --fs:13px; --fs-s:11px; --fs-h:13px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
[data-theme=dark]{
  --accent:#0A84FF; --green:#30D158; --orange:#FF9F0A; --red:#FF453A;
  --text:#f5f5f7; --text2:rgba(255,255,255,.6); --text3:rgba(255,255,255,.3);
  --bg:#1e1e20; --group:#2a2a2d; --sidebar:rgba(44,44,48,.88); --sep:rgba(255,255,255,.09);
  --ctl:#3a3a3d; --ctl-border:rgba(255,255,255,.12); --hover:rgba(255,255,255,.06); --sel:rgba(255,255,255,.1);
  --desk:linear-gradient(135deg,#1d2a3c,#2b3346 45%,#3b2f33);
  --shadow:0 22px 70px rgba(0,0,0,.6),0 0 0 .5px rgba(255,255,255,.16);
  --menu:rgba(42,42,46,.95); --accent-soft:rgba(10,132,255,.22);
  --banner-red:rgba(255,69,58,.14); --banner-orange:rgba(255,159,10,.14);
}
[data-plat=win]{--fs:14px; --fs-s:12px; --fs-h:14px; --font:"Segoe UI Variable","Segoe UI","Microsoft YaHei",-apple-system,system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-size:var(--fs);color:var(--text);background:#111;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.t2{color:var(--text2)} .t3{color:var(--text3)} .small{font-size:var(--fs-s)}
.c-green{color:var(--green)} .c-orange{color:var(--orange)} .c-red{color:var(--red)}

/* ---------- prototype controls ---------- */
#proto{position:fixed;left:0;right:0;top:0;z-index:100;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:8px 14px;background:#202024;color:#ddd;font:12px/1.4 -apple-system,system-ui,sans-serif;border-bottom:1px solid #333}
#proto b{color:#fff;font-weight:600;margin-right:4px}
#proto label{display:flex;gap:6px;align-items:center;color:#aaa}
#proto select,#proto button{background:#333;border:1px solid #444;color:#eee;border-radius:5px;padding:3px 8px;font-size:12px;cursor:pointer}
#proto button:hover{background:#3d3d42}
#proto .grp{display:flex;gap:4px;align-items:center}
#stage{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:flex-start;justify-content:center;overflow:hidden}
#screen{position:relative;width:1120px;height:760px;background:var(--desk);border-radius:10px;overflow:hidden;transform-origin:top center;flex:none}

/* ---------- mac menubar / win taskbar ---------- */
#menubar{position:absolute;top:0;left:0;right:0;height:26px;display:flex;align-items:center;gap:18px;padding:0 14px;background:rgba(255,255,255,.35);backdrop-filter:blur(20px);font-size:13px;color:#111}
[data-theme=dark] #menubar{background:rgba(0,0,0,.35);color:#eee}
#menubar .sp{flex:1}
#menubar .mbi{display:flex;align-items:center;gap:4px;padding:1px 6px;border-radius:4px;cursor:default}
#menubar .mbi.on{background:rgba(0,0,0,.15)} [data-theme=dark] #menubar .mbi.on{background:rgba(255,255,255,.2)}
#taskbar{position:absolute;bottom:0;left:0;right:0;height:44px;display:none;align-items:center;justify-content:flex-end;gap:10px;padding:0 14px;background:rgba(243,243,243,.85);backdrop-filter:blur(30px);border-top:1px solid rgba(0,0,0,.08);font-size:12px;color:#111}
[data-theme=dark] #taskbar{background:rgba(32,32,32,.88);color:#eee;border-color:rgba(255,255,255,.08)}
#taskbar .tbi{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:5px;cursor:default}
#taskbar .tbi:hover,#taskbar .tbi.on{background:rgba(0,0,0,.07)} [data-theme=dark] #taskbar .tbi:hover{background:rgba(255,255,255,.08)}
[data-plat=win] #menubar{display:none} [data-plat=win] #taskbar{display:flex}

/* ---------- window ---------- */
#win{position:absolute;left:80px;top:62px;width:960px;height:640px;border-radius:12px;overflow:hidden;box-shadow:var(--shadow);display:flex;background:var(--bg)}
[data-plat=win] #win{top:40px;border-radius:8px;flex-direction:column}
#titlebar{display:none;height:32px;align-items:center;flex:none;background:var(--bg);border-bottom:1px solid var(--sep)}
[data-plat=win] #titlebar{display:flex}
#titlebar .ttl{flex:1;padding-left:12px;font-size:12px;display:flex;gap:8px;align-items:center}
#titlebar .wb{width:46px;height:32px;display:flex;align-items:center;justify-content:center;font-size:12px}
#titlebar .wb:hover{background:var(--hover)} #titlebar .wb.x:hover{background:#c42b1c;color:#fff}
#body{display:flex;flex:1;min-height:0;position:relative}
[data-plat=mac] #body{height:100%;width:100%}

/* sidebar */
#sidebar{width:200px;flex:none;background:var(--sidebar);backdrop-filter:blur(30px);border-right:1px solid var(--sep);display:flex;flex-direction:column;padding:0 10px 10px}
[data-plat=win] #sidebar{background:var(--bg);backdrop-filter:none;padding-top:8px}
.lights{display:flex;gap:8px;height:52px;align-items:center;padding-left:8px}
.lights i{width:12px;height:12px;border-radius:50%;background:#ff5f57;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15)}
.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
[data-plat=win] .lights{display:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border-radius:6px;cursor:default;color:var(--text);user-select:none}
.nav-item:hover{background:var(--hover)}
.nav-item.on{background:var(--sel)}
.nav-item.on svg{color:var(--accent)}
[data-plat=win] .nav-item.on{position:relative;background:var(--hover)}
[data-plat=win] .nav-item.on:before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--accent)}
.nav-item .badge{margin-left:auto;font-size:11px;color:var(--text2);background:var(--sel);border-radius:9px;padding:0 6px;line-height:16px}
.sb-sp{flex:1}
.sb-sep{height:1px;background:var(--sep);margin:6px 4px}
.statusbar{padding:6px 8px 2px;border-radius:6px;cursor:default;line-height:18px}
.statusbar:hover{background:var(--hover)}
.statusbar .l1{display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;background:var(--text3)}
.dot.green{background:var(--green)}.dot.orange{background:var(--orange)}.dot.red{background:var(--red)}.dot.accent{background:var(--accent)}

/* main */
#main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.head{height:52px;flex:none;display:flex;align-items:center;gap:8px;padding:0 24px;border-bottom:1px solid transparent}
[data-plat=win] .head{height:56px}
.head h1{font-size:20px;font-weight:600;margin:0 auto 0 0;display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.head h1 small{font-size:var(--fs);font-weight:400;color:var(--text2)}
.content{flex:1;overflow:auto;padding:4px 24px 24px;position:relative}
.content.flush{padding:0;display:flex;flex-direction:column;overflow:hidden}

/* controls */
.btn{height:24px;padding:0 10px;border-radius:6px;border:.5px solid var(--ctl-border);background:var(--ctl);box-shadow:0 .5px 1px rgba(0,0,0,.08);display:inline-flex;align-items:center;gap:5px;cursor:default;white-space:nowrap}
.btn:hover{filter:brightness(.97)} [data-theme=dark] .btn:hover{filter:brightness(1.15)}
.btn:active{filter:brightness(.9)}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent}
.btn.danger{background:var(--red);color:#fff;border-color:transparent}
.btn.plain{background:transparent;border-color:transparent;box-shadow:none;color:var(--accent);padding:0 4px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.lg{height:30px;padding:0 16px}
[data-plat=win] .btn{height:28px;border-radius:4px}
.btn.sm{height:20px;padding:0 8px;font-size:11px}
[data-plat=win] .btn.sm{height:24px}
.ibtn{width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--text2);cursor:default;border:0;background:transparent;padding:0}
.ibtn:hover{background:var(--hover);color:var(--text)}
.search{position:relative;display:inline-flex;align-items:center}
.search svg{position:absolute;left:7px;color:var(--text2);pointer-events:none}
.search input{height:24px;width:170px;border-radius:6px;border:.5px solid var(--ctl-border);background:var(--ctl);padding:0 8px 0 24px;outline:none}
.search input:focus,.field:focus,.sel:focus{box-shadow:0 0 0 3px var(--accent-soft);border-color:var(--accent)}
.sel{height:24px;border-radius:6px;border:.5px solid var(--ctl-border);background:var(--ctl);padding:0 6px;outline:none}
.field{height:26px;border-radius:6px;border:.5px solid var(--ctl-border);background:var(--ctl);padding:0 8px;outline:none;width:100%}
.field.err{border-color:var(--red);box-shadow:0 0 0 3px rgba(255,59,48,.15)}
.switch{width:32px;height:18px;border-radius:9px;background:var(--sel);position:relative;flex:none;cursor:default;transition:background .2s;border:0;padding:0}
.switch:after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .2s}
.switch.on{background:var(--accent)}
.switch.on:after{transform:translateX(14px)}
.switch[disabled]{opacity:.45;pointer-events:none}
.seg{display:inline-flex;background:var(--sel);border-radius:7px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;height:22px;padding:0 18px;border-radius:5px;cursor:default}
.seg button.on{background:var(--ctl);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.seg.sm button{height:20px;padding:0 10px}
.spin{width:12px;height:12px;border-radius:50%;border:1.6px solid var(--text3);border-top-color:var(--text2);animation:spin .7s linear infinite;display:inline-block;flex:none}
.spin.w{border-color:rgba(255,255,255,.4);border-top-color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.tag{font-size:11px;line-height:16px;padding:0 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag.gray{background:var(--sel);color:var(--text2)}
.bar{height:4px;border-radius:2px;background:var(--sel);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px}

/* groups (settings / overview) */
.ghead{font-size:var(--fs-h);font-weight:600;margin:20px 0 8px 4px}
.ghead:first-child{margin-top:4px}
.group{background:var(--group);border-radius:10px;box-shadow:0 0 0 .5px var(--sep)}
.row{min-height:40px;display:flex;align-items:center;gap:10px;padding:8px 14px;position:relative}
.row+.row:before{content:"";position:absolute;top:0;left:14px;right:0;height:1px;background:var(--sep)}
.row .lbl{flex:1;min-width:0}
.row .desc{font-size:var(--fs-s);color:var(--text2);margin-top:2px}
.row .lbl-fixed{width:96px;flex:none}
.banner{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--banner-red);border-radius:8px;margin:0 10px 10px}
.banner.orange{background:var(--banner-orange)}
.banner.blue{background:var(--accent-soft)}
.banner .msg{flex:1;line-height:1.45}
.top-banner{margin:0 0 12px}

/* overview */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.card{background:var(--group);border-radius:10px;box-shadow:0 0 0 .5px var(--sep);padding:12px 14px;cursor:default;position:relative}
.card.link:hover{background:linear-gradient(var(--hover),var(--hover)),var(--group)}
.card .ct{display:flex;justify-content:space-between;color:var(--text2);font-size:var(--fs-s);margin-bottom:6px}
.card .big{font-size:17px;font-weight:600;margin-bottom:4px;display:flex;gap:6px;align-items:center}
.dim{opacity:.5}
.dim-note{position:absolute;right:14px;top:12px;font-size:var(--fs-s);color:var(--text2)}
.speed{margin-top:12px}
.speed .nums{display:flex;gap:32px;align-items:baseline;margin:4px 0 6px}
.speed .nums b{font-size:28px;font-weight:400;font-variant-numeric:tabular-nums}
.speed .nums span{color:var(--text2);margin-right:6px}
.speed .foot{display:flex;gap:14px;color:var(--text2);font-size:var(--fs-s);margin-top:6px}
.legend{display:flex;gap:12px;font-size:var(--fs-s);color:var(--text2)}
.legend i{display:inline-block;width:10px;height:2px;vertical-align:middle;margin-right:4px;background:var(--accent)}
.legend i.up{background:none;border-top:2px dashed var(--text2)}
.term{display:flex;align-items:center;gap:10px;margin-top:12px;padding:8px 14px;background:var(--group);border-radius:10px;box-shadow:0 0 0 .5px var(--sep)}
.term code{flex:1;font-family:var(--mono);font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tip{position:absolute;z-index:5;right:4px;top:calc(100% - 4px);background:var(--accent);color:#fff;padding:7px 10px;border-radius:7px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.2);display:flex;gap:8px;align-items:center;white-space:nowrap}
.tip:before{content:"";position:absolute;right:14px;top:-5px;border:5px solid transparent;border-top:0;border-bottom-color:var(--accent)}
.tip button{background:none;border:0;color:#fff;opacity:.8;cursor:default;padding:0}

/* exit map (overview) */
.xmap{margin-top:16px;padding:0;display:flex;overflow:hidden}
.xmap .mapc{flex:1;min-width:0;position:relative;border-right:1px solid var(--sep)}
.xmap .mapc .ct{position:absolute;left:14px;top:10px;right:14px;margin:0;z-index:1;pointer-events:none}
.xmap .mapc .ct button{pointer-events:auto}
.xmap svg{display:block;width:100%;height:200px}
.xmap svg .land{fill:var(--text3);opacity:.85}
.xmap svg .lbl{font-size:11px;fill:var(--text);paint-order:stroke;stroke:var(--group);stroke-width:3px;stroke-linejoin:round}
.xmap svg .lbl.you{font-weight:600}
.xmap svg .flow path{transition:stroke-width .4s}
.xlist{width:220px;flex:none;overflow:auto;max-height:200px;padding:6px 0}
.xl-item{padding:7px 14px;cursor:default}
.xl-item:hover{background:var(--hover)}
.xl-item.main{padding-bottom:9px}
.xl-item.main .xl-name{font-size:15px;font-weight:600}
.xl-name{display:flex;align-items:center;gap:6px;min-width:0}
.xl-name i{width:8px;height:8px;border-radius:2px;flex:none}
.xl-name span:first-of-type{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xl-name .xl-d{font-size:var(--fs-s);font-weight:400}
.xl-sub{display:flex;gap:4px;align-items:center;margin:2px 0 0 14px}
.xl-item .xl-x{margin-left:14px}
.xl-sec{font-size:var(--fs-s);color:var(--text2);padding:8px 14px 2px;border-top:1px solid var(--sep);margin-top:2px}
.xl-empty{padding:28px 14px;text-align:center;line-height:1.6}
.tag.gray{background:var(--sel);color:var(--text2)}
.tag.green{background:rgba(52,199,89,.14);color:var(--green)}
.cards.half{grid-template-columns:1fr 1.25fr}
.cards.half .speed{margin-top:0}
.tag.orange{background:rgba(255,149,0,.14);color:var(--orange)}
.row.col{flex-direction:column;align-items:stretch;gap:6px}
.ta{width:100%;min-height:40px;border-radius:6px;border:.5px solid var(--ctl-border);background:var(--ctl);padding:6px 8px;font-family:var(--mono);font-size:12px;resize:vertical;outline:none;line-height:1.5}
.ta:focus{box-shadow:0 0 0 3px var(--accent-soft);border-color:var(--accent)}
.ta:disabled,.field:disabled{opacity:.55}
.field.mono{font-family:var(--mono);font-size:11.5px}
.applybar{position:sticky;bottom:-24px;display:none;align-items:center;gap:10px;margin:16px -24px -24px;padding:10px 24px;background:var(--group);border-top:1px solid var(--sep);z-index:3}
.applybar.show{display:flex}
.applybar .msg{flex:1;color:var(--text2)}
.rules .tbl{background:var(--group);border-radius:10px;box-shadow:0 0 0 .5px var(--sep);overflow:hidden}
.rules .tbl th{background:var(--group)}
.rules .tbl td{height:30px;max-width:260px}
.rules .tbl tr.off td{opacity:.45}
.rules .tbl tr.off td:last-child{opacity:1}
.foot-hint{font-size:var(--fs-s);color:var(--text2);margin:8px 4px 0}
.net-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.net-grid .group{padding:12px 14px}
.ipc .ct{display:flex;justify-content:space-between;color:var(--text2);font-size:var(--fs-s)}
.ipc .ip{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;margin:4px 0 6px}
.ipc .kv{margin-top:6px}
.dlg.wide{width:580px}
.yaml{font-family:var(--mono);font-size:12px;background:var(--bg);border:.5px solid var(--sep);border-radius:6px;max-height:300px;overflow:auto;padding:6px 0}
.yaml .ln{display:flex;padding:0 10px;white-space:pre;line-height:1.65}
.yaml .ln .src{margin-left:auto;padding-left:16px;font-family:var(--font);font-size:11px;color:var(--text2)}
.yaml .ln.add{background:rgba(52,199,89,.13)} .yaml .ln.del{background:rgba(255,59,48,.1);text-decoration:line-through;color:var(--text2)}
.result{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--bg);border:.5px solid var(--sep);line-height:1.6}
.speed.compact .nums{gap:18px;margin:2px 0 4px}
.speed.compact .nums b{font-size:20px}
.speed.compact .foot{flex-wrap:wrap;gap:4px 10px}

/* empty */
.empty{height:100%;min-height:360px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;color:var(--text2)}
.empty .ico{width:56px;height:56px;border-radius:14px;background:var(--sel);display:flex;align-items:center;justify-content:center;color:var(--text2);margin-bottom:4px}
.empty h3{margin:0;font-size:15px;color:var(--text);font-weight:600}
.empty .acts{display:flex;gap:8px;margin-top:6px}

/* proxy */
.pgroup{background:var(--group);border-radius:10px;box-shadow:0 0 0 .5px var(--sep);margin-bottom:10px;overflow:hidden}
.pghead{display:flex;align-items:center;gap:8px;height:40px;padding:0 8px 0 10px;cursor:default;user-select:none}
.pghead:hover{background:var(--hover)}
.pghead .chev{color:var(--text2);transition:transform .15s;display:flex}
.pghead.open .chev{transform:rotate(90deg)}
.pghead .name{font-weight:600;font-size:var(--fs-h)}
.pghead .meta{color:var(--text2);font-size:var(--fs-s);margin-right:auto}
.node{display:flex;align-items:center;gap:10px;height:32px;padding:0 14px 0 34px;cursor:default;position:relative}
.node:hover{background:var(--hover)}
.node:before{content:"";position:absolute;top:0;left:34px;right:0;height:1px;background:var(--sep)}
.node .radio{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--text3);flex:none}
.node.cur .radio{border:4px solid var(--accent)}
.node .nm{flex:1;display:flex;gap:6px;align-items:center}
.node .proto{font-size:10px;color:var(--text3);letter-spacing:.3px}
.delay{min-width:64px;text-align:right;font-variant-numeric:tabular-nums;display:flex;justify-content:flex-end;align-items:center;border-radius:4px;padding:2px 4px}
.delay:hover{background:var(--sel)}
.pgroup.disabled .node{opacity:.5;pointer-events:none}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{position:sticky;top:0;z-index:1;background:var(--bg);text-align:left;font-weight:400;color:var(--text2);font-size:var(--fs-s);height:28px;padding:0 8px;border-bottom:1px solid var(--sep);white-space:nowrap;cursor:default}
.tbl th.sorted{color:var(--text)}

  let w=Math.max(x1-x0,50)*1.3, h=Math.max(y1-y0,26)*1.45;

const landCache={};
function landDots(P,W,H){
  const key=[P.L,P.T,P.w].map(v=>v.toFixed(2)).join();
  if(landCache[key]) return landCache[key];
  const step=P.w/78, out=[];
  for(let lat=P.T-step*P.k/2; lat>P.T-P.h; lat-=step*P.k)
    for(let lon=P.L+step/2; lon<P.L+P.w; lon+=step)
      if(onLand(lon,lat)) out.push(`<circle cx="${((lon-P.L)/P.w*W).toFixed(1)}" cy="${((P.T-lat)/P.h*H).toFixed(1)}" r="1.25"/>`);

}
function arcW(speed){ return (1.4+Math.min(4.6,Math.log10(1+speed/2e3)*1.7)).toFixed(2); }
function arcPath([x0,y0],[x1,y1],bend){
  const dx=x1-x0,dy=y1-y0,d=Math.hypot(dx,dy)||1; let nx=-dy/d,ny=dx/d; if(ny>0){nx=-nx;ny=-ny;}
  const cx=(x0+x1)/2+nx*d*bend, cy=(y0+y1)/2+ny*d*bend;
  return `M${x0.toFixed(1)},${y0.toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${x1.toFixed(1)},${y1.toFixed(1)}`;
}
// 动态线：每条路由同一时间只有一个「请求」在路上。
// 一个请求 = 线从你出发逐渐画向出口（头部带亮点）→ 到达后整条线淡出、出口泛起涟漪 → 停顿 → 下一个请求。
// 流量越大，两次请求之间的停顿越短；没有流量时不发送。开启「减少动态效果」时改为静态细线。
const mapArcs={}, flowState={};
const reduceMotion=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const easeInOut=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function flowGap(speed){ return speed>700e3?180:speed>120e3?500:1100; }   // 两次请求之间的停顿（ms）
function arcFlow(i){
  const a=mapArcs[i]; if(!a) return '';
  const w=+arcW(a.speed), c=a.color;
  if(reduceMotion()) return `<g class="flow" id="flow${i}"><path d="${a.d}" fill="none" stroke="${c}" stroke-width="${a.speed>0?w:1}" stroke-linecap="round" opacity="${a.speed>0?.75:.25}"/></g>`;
  return `<g class="flow" id="flow${i}">
    <path class="fl" d="${a.d}" pathLength="100" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="100 100" stroke-dashoffset="100" opacity="0"/>
    <circle class="fr" cx="${a.p[0].toFixed(1)}" cy="${a.p[1].toFixed(1)}" r="4" fill="none" stroke="${c}" stroke-width="1.5" opacity="0"/>
    <circle class="fg" r="${(w*1.6+4).toFixed(1)}" fill="${c}" opacity="0"/>
    <circle class="fh" r="${(w/2+1.6).toFixed(1)}" fill="${c}" opacity="0"/>
  </g>`;
}
function updateFlows(rs){
  rs.forEach((r,i)=>{ const a=mapArcs[i]; if(!a) return;
    a.speed=a.speed*.6+r.speed*.4;            // 平滑，避免粗细跳变
    const g=document.getElementById('flow'+i); if(!g) return;
    const w=+arcW(a.speed);
    g.querySelector('.fl')?.setAttribute('stroke-width',w.toFixed(2));
    g.querySelector('.fh')?.setAttribute('r',(w/2+1.6).toFixed(1));
    g.querySelector('.fg')?.setAttribute('r',(w*1.6+4).toFixed(1));
  });
}
function flowFrame(now){
  if(!reduceMotion()) for(const i in mapArcs){
    const a=mapArcs[i], g=document.getElementById('flow'+i); if(!g) continue;
    const path=g.querySelector('.fl'), head=g.querySelector('.fh'), glow=g.querySelector('.fg'), ring=g.querySelector('.fr'); if(!path) continue;
    const st=flowState[i]||(flowState[i]={phase:'idle',t:now+Math.random()*600});
    const set=(el,k,v)=>el.setAttribute(k,v);
    if(st.phase==='idle'){
      set(path,'opacity',0); set(head,'opacity',0); set(glow,'opacity',0); set(ring,'opacity',0);
      if(now>=st.t && a.speed>0){ const L=path.getTotalLength(); st.phase='go'; st.t=now; st.dur=Math.max(900,Math.min(1600,650+L*2.6)); }
    }
    if(st.phase==='go'){
      const p=Math.min(1,(now-st.t)/st.dur), e=easeInOut(p), pt=path.getPointAtLength(path.getTotalLength()*e);
      set(path,'stroke-dashoffset',(100-100*e).toFixed(2)); set(path,'opacity',.85);
      for(const el of [head,glow]){ set(el,'cx',pt.x.toFixed(1)); set(el,'cy',pt.y.toFixed(1)); }
      set(head,'opacity',1); set(glow,'opacity',.22);
      if(p>=1){ st.phase='fade'; st.t=now; }
    }
    if(st.phase==='fade'){
      const p=Math.min(1,(now-st.t)/520), o=1-p;
      set(path,'opacity',(.85*o).toFixed(3)); set(head,'opacity',o.toFixed(3)); set(glow,'opacity',(.22*o).toFixed(3));
      set(ring,'r',(4+10*easeInOut(p)).toFixed(1)); set(ring,'opacity',(.9*o).toFixed(3));
      if(p>=1){ st.phase='idle'; st.t=now+flowGap(a.speed); }
    }
  }
  requestAnimationFrame(flowFrame);
}
requestAnimationFrame(flowFrame);
function exitMapSVG(rs){
  const W=480,H=200, you=CITY[YOU.city];
  const geoRs=rs.filter(r=>r.geo);
  const P=mapProj([you,...geoRs.map(r=>CITY[r.geo.city])],W,H);
  const Y=P.at(...you);
  const seen={}, cities={};
  for(const k in mapArcs) delete mapArcs[k];
  const arcs=rs.map((r,i)=>{ if(!r.geo) return '';
    const p=P.at(...CITY[r.geo.city]); cities[r.geo.city]=p;
    const n=seen[r.geo.city]=(seen[r.geo.city]||0)+1;
    mapArcs[i]={d:arcPath(Y,p,.2+.16*(n-1)),p,color:r.color,speed:r.speed};
    return arcFlow(i); }).join('');
  const label=([x,y],t,cls='')=>{ const right=x>W-60; return `<text class="lbl ${cls}" x="${(right?x-8:x+8).toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="${right?'end':'start'}">${esc(t)}</text>`; };
  const marks=Object.entries(cities).map(([c,p])=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="var(--group)" stroke="var(--text)" stroke-width="1.6"/>${label(p,c)}`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="出口地图：从你所在的${YOU.city}到各出口城市">
    <g class="land">${landDots(P,W,H)}</g>${arcs}${marks}
    <circle cx="${Y[0].toFixed(1)}" cy="${Y[1].toFixed(1)}" r="5" fill="var(--text)"/>${label(Y,'你 · '+YOU.city,'you')}
  </svg>`;
}

function guessSuffix(host){ const h=host.replace(/:\d+$/,''); if(/^[\d.]+$/.test(h)) return h; const p=h.split('.'); return p.slice(-2).join('.'); }
function matchRule(input){
  const h=input.trim().toLowerCase().replace(/^https?:\/\//,'').replace(/[/:].*$/,'');
  const GEO={youtube:['youtube.com','googlevideo.com','ytimg.com'],netflix:['netflix.com','nflxvideo.net'],github:['github.com','githubusercontent.com'],google:['google.com','googleapis.com','gstatic.com'],microsoft:['microsoft.com','visualstudio.com'],cn:['.cn','baidu.com','bilibili.com','qq.com','taobao.com']};
  const hit=r=>{ const pl=String(r.payload).toLowerCase();
    if(r.type==='DOMAIN-SUFFIX') return h===pl||h.endsWith('.'+pl);
    if(r.type==='DOMAIN') return h===pl;
    if(r.type==='DOMAIN-KEYWORD') return h.includes(pl);
    if(r.type==='GEOSITE') return (GEO[pl]||[]).some(d=>d.startsWith('.')?h.endsWith(d):(h===d||h.endsWith('.'+d)));
    if(r.type==='IP-CIDR') return pl.startsWith('192.168')&&h.startsWith('192.168.')||pl.startsWith('10.')&&h.startsWith('10.');
    return r.type==='MATCH'; };
  const c=customRules.findIndex(hit); if(c>=0) return {src:'自定义',idx:c+1,r:customRules[c],host:h};
  const r=SUB_RULES.find(x=>!x.off&&hit(x)); return {src:'订阅',idx:r.i,r,host:h};
}

const PAGES={overview:pageOverview,proxy:pageProxy,subs:pageSubs,conns:pageConns,logs:pageLogs,rules:pageRules,net:pageNet,settings:pageSettings};
function renderMain(){
  const a=document.activeElement, aid=a&&a.id, sel=aid&&a.selectionStart;
  const p=PAGES[S.page]();
  const prevScroll=$('#main .content')?.scrollTop||0;
  $('#main').innerHTML=`<div class="head"><h1>${p.title}</h1>${p.tools||''}</div><div class="content ${p.flush?'flush':''}">${p.body}</div>`;
  const c=$('#main .content'); if(c && !p.flush) c.scrollTop=prevScroll;
  if(aid){ const e=document.getElementById(aid); if(e){ e.focus(); try{e.setSelectionRange(sel,sel);}catch(_){} } }

function render(){ document.documentElement.dataset.theme=S.theme; document.documentElement.dataset.plat=S.plat; renderSidebar(); renderMain(); renderTrayIcon(); renderDialog(); if(S.trayOpen) renderTray(); syncProto(); }
function syncProto(){
  document.querySelectorAll('#proto [data-p]').forEach(b=>b.style.background=(S[b.dataset.p]===b.dataset.v)?'#0a84ff':'');

/* ================= logs scroll ================= */
function initLogScroll(){
  const l=$('#logList'); if(!l) return;
  if(S.logFollow) l.scrollTop=l.scrollHeight;
  l.onscroll=()=>{ const atBottom=l.scrollHeight-l.scrollTop-l.clientHeight<8; if(atBottom!==S.logFollow){ S.logFollow=atBottom; if(atBottom) S.logNew=false; const st=l.scrollTop; renderMain(); const l2=$('#logList'); if(l2&&!atBottom) l2.scrollTop=st; } };
}

/* ================= popup menu ================= */
function openMenu(anchor,items){
  const body=$('#body').getBoundingClientRect(), r=anchor.getBoundingClientRect(), sc=body.width/($('#body').offsetWidth||1);
  const html=items.map(it=>it==='-'?'<div class="msep"></div>':
    `<div class="mi ${it.dis?'dis':''} ${it.danger?'danger':''}" ${it.act?`data-act="${it.act}" data-v="${esc(it.v??'')}"`:''}><span class="ck">${it.ck?'✓':''}</span>${it.l}</div>${it.hint?`<div class="mhint">${it.hint}</div>`:''}`).join('');
  const p=$('#popup'); p.innerHTML=`<div class="menu">${html}</div>`;
  const m=p.firstChild;
  let left=(r.right-body.left)/sc-200, top=(r.bottom-body.top)/sc+4;
  left=Math.max(8,left); m.style.left=left+'px'; m.style.top=top+'px';
  S.popup=true;
}
function closeMenu(){ $('#popup').innerHTML=''; S.popup=null; }

function openImport(phase){
  S.dlg={type:'import',phase:phase||'idle',step:0,url:'https://sub.example.com/api/v1/client/subscribe?token=7f3e9c',name:'',use:true,adv:false,err:''};
  if(phase==='loading'){ S.dlg.step=0; }
  if(phase==='error'){ S.dlg.err='下载失败：HTTP 403。链接可能已失效，请在机场后台重新复制订阅链接。'; }
  closeMenu(); renderDialog(); setTimeout(()=>$('#dUrl')?.focus(),0);
}
function doImport(){
  const d=S.dlg; d.url=$('#dUrl').value.trim(); d.name=$('#dName').value.trim(); d.use=$('#dUse').checked;
  if(!/^https?:\/\//.test(d.url)){ d.phase='error'; d.err='请输入以 http:// 或 https:// 开头的订阅链接。'; renderDialog(); return; }
  d.phase='loading'; d.step=0; renderDialog();
  setTimeout(()=>{ if(S.dlg!==d) return;
    if(d.url.includes('fail')){ d.phase='error'; d.err='下载失败：连接超时。可稍后重试，或在「高级」中开启“通过代理下载”。'; renderDialog(); return; }
    d.step=1; renderDialog();
    setTimeout(()=>{ if(S.dlg!==d) return; d.step=2; renderDialog();
      setTimeout(()=>{ if(S.dlg!==d) return;
        const name=d.name||'新机场'+(subs.length+1);
        subs.push({name,src:'链接',url:d.url,used:0.8,total:100,exp:'2027-11-08',upd:'刚刚',auto:'12'});
        const first=!S.hasSubs; S.hasSubs=true;
        if(d.use) curSub=name;
        S.dlg=null;
        if(first||S.kernel!=='running'){ startKernel(()=>{ S.tip=true; S.sysproxy=false; render(); toast('已导入并启动'); }); }
        else toast(d.use?`已导入并切换到 ${name}`:'订阅已导入');
        render();
      },500);
    },700);
  },900);
}

/* ================= toast ================= */
let toastT;
function toast(msg,bad,detail){
  const t=$('#toast');
  t.innerHTML=`<span class="${bad?'bad':'ok'}">${ic(bad?'warn':'check',15,1.8)}</span><span>${esc(msg)}</span>${detail?`<button class="btn plain" data-act="nav" data-v="logs">查看详情</button>`:''}`;
  t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),bad?5000:3000);
}

/* ================= actions ================= */
function startKernel(cb){
  if(S.kernel==='missing'){ toast('未找到 Mihomo 内核',true); return; }
  S.kernel='starting'; render();
  setTimeout(()=>{ S.kernel='running'; S.uptime=0; S.totUp=0; S.totDown=0; render(); cb&&cb(); },1100);
}
function testNodes(names){
  names=names.filter(n=>n in delays);
  names.forEach(n=>delays[n]='testing'); renderMain(); if(S.trayOpen) renderTray();
  names.forEach((n,i)=>setTimeout(()=>{
    const r=Math.random(); delays[n]= r<.08?'timeout': r<.2?Math.round(rnd(320,1100)):Math.round(rnd(45,300));
    if(S.page==='proxy') renderMain(); if(S.page==='overview') renderMain();
  },300+i*rnd(120,260)+rnd(0,300)));
}
function findGroup(n){ return groups.concat(globalGroup).find(g=>g.name===n); }
function useSub(i){
  const s=subs[i]; if(!s||s.name===curSub) return;
  s.switching=true; renderMain();
  setTimeout(()=>{ s.switching=false;
    if(s.name==='备用机场'){ S.dlg={type:'invalid',name:s.name,err:"line 42: proxy-groups[1]: proxy 'xx' not found"}; render(); return; }
    curSub=s.name; render(); toast(`已切换到 ${s.name}`);
  },900);
}

  'snf-mode':v=>{ if(S.snf.mode===v) return; S.snf.mode=v; S.dirty=true; renderMain(); },
  'snf-override':()=>{ S.snf.override=!S.snf.override; S.dirty=true; renderMain(); },
  'snf-pure':()=>{ S.snf.pureIp=!S.snf.pureIp; S.dirty=true; renderMain(); },
  'override-edit':v=>{ closeMenu(); const sub=v.startsWith('sub:')?subs[+v.slice(4)]:null;
    S.dlg={type:'override',key:sub?sub.name:'global',title:sub?sub.name:'全局',text:sub?(overrides.subs[sub.name]||'# 只作用于「'+sub.name+'」\n'):overrides.global}; renderDialog(); setTimeout(()=>$('#ovText')?.focus(),0); },
  'override-diff':()=>{ const d=S.dlg; if(d.diff){ d.diff=null; renderDialog(); return; } d.text=$('#ovText').value;
    const add=d.text.split('\n').filter(l=>l.trim()&&!l.trim().startsWith('#'));
    const rows=[...add.filter(l=>l.trim().startsWith('-')).map(l=>`<div class="ln add"><span>+ ${esc(l.trim())}</span><span class="src">新增</span></div>`),
      ...add.filter(l=>/^[a-z-]+:\s*\S/.test(l)).map(l=>`<div class="ln del"><span>- ${esc(l.split(':')[0])}: info</span></div><div class="ln add"><span>+ ${esc(l.trim())}</span><span class="src">修改</span></div>`)];
    d.diff=rows.length?rows.join(''):'<div class="ln t2"><span>与当前配置没有差异</span></div>';
    renderDialog(); },
  'override-save':()=>{ const d=S.dlg; if(!d.diff) d.text=$('#ovText').value; d.saving=true; d.err=''; renderDialog();
    setTimeout(()=>{ if(S.dlg!==d) return; d.saving=false;
      if(/^\s*-\s*[A-Z-]+,[^,\n]+$/m.test(d.text)){ d.err='规则格式应为「类型,内容,策略」，例如 DOMAIN-SUFFIX,example.com,DIRECT。当前配置未改变。'; d.diff=null; renderDialog(); return; }
      if(d.key==='global') overrides.global=d.text; else overrides.subs[d.key]=d.text;
      S.dlg=null; render(); toast('覆写已保存，内核已重新加载配置'); },800); },
  'runtime-view':()=>{ S.dlg={type:'runtime'}; renderDialog(); },
  'geo-mode':v=>{ if(S.geo.mode===v) return; S.geo.mode=v; renderMain(); toast(`GEOIP 规则改用 ${v==='db'?'MMDB':'DAT'}，内核已重新加载配置`); },
  'geo-auto':()=>{ S.geo.auto=!S.geo.auto; renderMain(); },
  'geo-update':()=>{ S.geo.updating=true; renderMain(); setTimeout(()=>{ S.geo.updating=false; S.geo.date='2026-11-08'; if(S.page==='settings') renderMain(); toast('外部资源已更新'); },1500); },

  noop:()=>{},
};

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!e.target.closest('.menu')&&!(el&&['group-menu','sub-menu','import-menu','log-menu','crule-menu'].includes(el.dataset.act))) closeMenu();
  if(S.trayOpen&&!e.target.closest('#trayMenu')&&!(el&&el.dataset.act==='tray')) closeTray();
  if(!el) return;
  if(el.closest('[disabled]')) return;
  e.preventDefault(); e.stopPropagation();
  const f=A[el.dataset.act]; f&&f(el.dataset.v,el);
});
document.addEventListener('dblclick',e=>{ const tr=e.target.closest('[data-dbl]'); if(tr&&!e.target.closest('[data-act]')) useSub(+tr.dataset.v); });
document.addEventListener('input',e=>{
  if(e.target.closest('[data-dirty]')){ A.dirty(); return; }
  if(e.target.dataset.in2){ S[e.target.dataset.in2]=e.target.value; return; }
  const k=e.target.dataset.in; if(!k) return; S[k]=e.target.value;
  if(k==='connQ'){ $('#connBody').innerHTML=connRows(); } else renderMain();
});
document.addEventListener('change',e=>{
  const k=e.target.dataset.ch; if(!k) return;
  if(k.startsWith('geo.')){ S.geo[k.slice(4)]=e.target.value; return; }
  if(k.startsWith('set.')){ const key=k.slice(4); S.set[key]=e.target.value;
    if(key==='appearance'){ if(e.target.value!=='system') S.theme=e.target.value; render(); } return; }
  S[k]=e.target.value; renderMain();
});
document.addEventListener('focusout',e=>{
  if(e.target.dataset.blur!=='port') return;
  const v=e.target.value.trim();
  if(v===S.port&&!S.portErr) return;
  if(!/^\d+$/.test(v)||+v<1||+v>65535){ S.portErr='端口须为 1–65535 之间的数字，已保留原值 '+S.port+'。'; S.portTry=v; }
  else if(['9090','7891','80','443'].includes(v)){ S.portErr=`端口 ${v} 已被其他程序占用，已保留原值 ${S.port}。`; S.portTry=v; }
  else { S.port=v; S.portErr=''; toast('代理端口已改为 '+v); }
  renderMain();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ closeMenu(); closeTray(); if(S.dlg){S.dlg=null;renderDialog();} return; }
  const mod=e.metaKey||e.ctrlKey; if(!mod) return;
  if(/^[1-7]$/.test(e.key)){ e.preventDefault(); A.nav(NAV_ALL[+e.key-1][0]); }
  else if(e.key===','){ e.preventDefault(); A.nav('settings'); }
  else if(e.key==='f'){ const s=$('#main .search input'); if(s){ e.preventDefault(); s.focus(); } }
  else if(e.key==='r'){ if(S.page==='proxy'){e.preventDefault();A['test-all']();} if(S.page==='subs'){e.preventDefault();A['update-all']();} }
});
/* real drag & drop */
let dragDepth=0;
$('#win').addEventListener('dragenter',e=>{ e.preventDefault(); dragDepth++; if(!S.drag){ S.drag=true; if(S.page!=='subs') S.page='subs'; render(); } });
$('#win').addEventListener('dragover',e=>e.preventDefault());
$('#win').addEventListener('dragleave',()=>{ if(--dragDepth<=0){ dragDepth=0; S.drag=false; renderMain(); } });
$('#win').addEventListener('drop',e=>{ e.preventDefault(); dragDepth=0; S.drag=false; const f=e.dataTransfer.files[0]; const n=f?f.name:'config.yaml';
  if(!/\.ya?ml$/i.test(n)){ renderMain(); toast('只支持 .yaml / .yml 文件',true); return; }
  subs.push({name:n.replace(/\.ya?ml$/i,''),src:'文件',url:'',upd:'刚刚',auto:'0'}); S.hasSubs=true; renderMain(); toast('已从文件导入 '+n); });

/* ================= prototype controls ================= */
document.querySelectorAll('#proto [data-p]').forEach(b=>b.onclick=()=>{ S[b.dataset.p]=b.dataset.v; if(b.dataset.p==='theme') S.set.appearance=b.dataset.v; closeTray(); render(); });
$('#pKernel').onchange=e=>{ S.kernel=e.target.value; if(S.kernel!=='running') S.sysproxy=false; else S.sysproxy=true; if(S.kernel==='running'||S.kernel==='starting') S.hasSubs=true; render(); };
$('#pSubs').onchange=e=>{ S.hasSubs=e.target.value==='1'; if(!S.hasSubs){ S.kernel=S.kernel==='missing'?'missing':'stopped'; S.sysproxy=false; } else if(S.kernel==='stopped'){ S.kernel='running'; S.sysproxy=true; } S.page='overview'; render(); };
$('#pScene').onchange=e=>{
  const v=e.target.value; e.target.value=''; closeTray(); S.dlg=null;
  const ensure=()=>{ S.hasSubs=true; if(S.kernel!=='running'){ S.kernel='running'; S.sysproxy=true; } };
  switch(v){
    case 'import': S.page='subs'; render(); openImport(); break;
    case 'import-loading': S.page='subs'; render(); openImport('loading'); S.dlg.phase='loading'; S.dlg.step=0; renderDialog(); break;
    case 'import-error': S.page='subs'; render(); openImport('error'); S.dlg.phase='error'; renderDialog(); break;
    case 'invalid': ensure(); S.page='subs'; S.dlg={type:'invalid',name:'备用机场',err:"line 42: proxy-groups[1]: proxy 'xx' not found"}; render(); break;
    case 'delete': ensure(); S.page='subs'; render(); A['sub-del'](1); break;
    case 'recover': S.kernel='stopped'; S.sysproxy=false; S.page='overview'; S.dlg={type:'recover'}; render(); break;
    case 'toast-ok': toast('已切换到 东京 03'); break;
    case 'toast-bad': toast('「备用机场」更新失败：连接超时',true,true); break;
    case 'drag': ensure(); S.page='subs'; S.drag=true; render(); setTimeout(()=>{S.drag=false; renderMain();},3500); break;
    case 'port': S.page='settings'; S.portTry='9090'; S.portErr='端口 9090 已被其他程序占用，已保留原值 '+S.port+'。'; render(); break;
    case 'testing': ensure(); S.page='proxy'; groups[0].open=true; render(); testNodes(NODES); break;
    case 'tray': ensure(); render(); S.trayOpen=true; renderTray(); break;
    case 'firstrun': ensure(); S.sysproxy=false; S.tip=true; S.page='overview'; render(); break;
  }
};

/* ================= ticking ================= */
setInterval(()=>{
  // clock
  if(S.kernel==='running'){
    S.down.push(nextSpeed(S.down[59],900e3,30e3,4e6)); S.down.shift();
    S.up.push(nextSpeed(S.up[59],20e3,1e3,200e3)); S.up.shift();
    S.totDown+=S.down[59]; S.totUp+=S.up[59]; S.uptime++;
    if(!S.connPaused){ tickConns(); if(Math.random()<.15&&closedConns.length){ conns.push(closedConns.shift()); } }
    if(!S.logPaused && Math.random()<.7){
      const l=genLog(); logs.push(l); if(logs.length>1000) logs.shift();
      if(S.page==='logs'&&logVisible(l)){ const list=$('#logList'); if(list){ if(list.querySelector('.empty')) list.innerHTML=''; list.insertAdjacentHTML('beforeend',logLineHTML(l)); if(S.logFollow) list.scrollTop=list.scrollHeight; else if(!S.logNew){ S.logNew=true; const st=list.scrollTop; renderMain(); $('#logList').scrollTop=st; } } }
    }
  }
  const run=S.kernel==='running';
  if(run){ const u=$('#sbUp'), d=$('#sbDown'); if(u){u.textContent='↑ '+fmtSpeed(S.up[59]); d.textContent='↓ '+fmtSpeed(S.down[59]);} }
  if(S.page==='overview'&&run&&$('#chart')){ $('#chart').innerHTML=chartSVG(true); $('#ovUp').textContent=fmtSpeed(S.up[59]); $('#ovDown').textContent=fmtSpeed(S.down[59]); $('#ovFoot').innerHTML=footText(true);
    const rs=exitRoutes(); updateFlows(rs); rs.forEach((r,i)=>{ const x=document.getElementById('xs'+i); if(x) x.textContent=xsText(r); }); }
  if(S.page==='conns'&&run&&!S.connPaused&&$('#connBody')){ $('#connBody').innerHTML=connRows(); const d=$('#connDetail'); if(d) d.innerHTML=connDetail(); const h=$('#main h1 small'); if(h) h.textContent=conns.length+' 个活动连接'; }
  if(S.trayOpen&&run){ const info=$('#trayMenu .mi.info .num'); if(info) info.textContent=fmtSpeed(S.down[59]); }
},1000);

/* ================= fit to viewport ================= */
function fit(){
  const ph=$('#proto').offsetHeight; const st=$('#stage'); st.style.top=ph+'px';
  const s=Math.min(1,(innerWidth-24)/1120,(innerHeight-ph-24)/760);
  $('#screen').style.transform=`scale(${s})`; $('#screen').style.marginTop='12px';
}
addEventListener('resize',fit);
if(matchMedia('(prefers-color-scheme: dark)').matches) S.theme='dark';
render(); fit();
</script>
</body>
</html>
