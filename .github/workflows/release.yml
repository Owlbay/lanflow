name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require tag to match mygo.json version
        run: |
          version="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' mygo.json)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match mygo.json version ${version}" >&2
            exit 1
          fi

  build-macos:
    name: Build macOS
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      # The host core (arm64) first: prepare-resources only fetches it when
      # bin/mihomo is missing, and the cross fetch below overwrites bin/mihomo.
      - name: Prepare resources
        run: |
          scripts/prepare-resources.sh darwin arm64
          scripts/prepare-resources.sh darwin amd64

      # No Developer ID: mygo signs ad hoc ("-"), which Apple Silicon requires to run at all.
      - name: Build app and disk images
        run: go tool mygo build -platform darwin/arm64,darwin/amd64

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp build/darwin-arm64/*.dmg build/darwin-amd64/*.dmg dist/
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: lanflow-macos
          path: dist/*

  build-windows:
    name: Build Windows
    needs: validate
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Prepare resources
        run: scripts/prepare-resources.sh windows amd64

      # mygo downloads NSIS on Windows for the setup installer.
      - name: Build app and installer
        run: go tool mygo build -platform windows/amd64

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find build -maxdepth 2 -name '*-setup-*.exe' -exec cp {} dist/ \;
          ls -la dist
          ls dist/*-setup-*.exe >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: lanflow-windows
          path: dist/*

  release:
    name: Create GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: artifacts
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: 澜流 Lanflow ${{ github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
