name: Release

on:
  push:
    tags: ["v*"]

# Read-only by default; only the release job may write (create the release,
# sign attestations).
permissions:
  contents: read

# Release builds never restore or save the Go module/build cache, so a cache
# written by another workflow cannot end up in a published binary.

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the previous release tag, for the helper check

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # Installed helpers are replaced only when their version differs, so
      # a release whose helper changed must bump cmd/lanflow-helper/VERSION.
      - name: Require a helper version bump when the helper changed
        run: scripts/check-helper-version.sh "${GITHUB_REF_NAME}"

      - name: Require the update signing key
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          if [ -z "${MYGO_UPDATER_PRIVATE_KEY}" ]; then
            echo "secret MYGO_UPDATER_PRIVATE_KEY is not set: installed apps could not update to this release" >&2
            exit 1
          fi

      - name: Require tag to match mygo.json version
        run: |
          version="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' mygo.json)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match mygo.json version ${version}" >&2
            exit 1
          fi
          if ! grep -q "const appVersion = \"${version}\"" internal/view/settings/page.go; then
            echo "internal/view/settings/page.go appVersion does not match ${version}" >&2
            exit 1
          fi

  build-macos:
    name: Build macOS
    needs: validate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Vet
        run: |
          go vet ./...
          go tool mygo vet .

      - name: Test
        env:
          CGO_ENABLED: "0"
        run: go test ./...

      # fetch-core.sh checks the core and geodata against SHA-256 sums
      # (pinned for the core, from the GitHub API for geodata) and writes
      # bin/<goos>-<goarch>/; prepare-resources.sh copies from there.
      - name: Prepare resources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          scripts/prepare-resources.sh darwin arm64
          scripts/prepare-resources.sh darwin amd64

      # No Developer ID: mygo signs ad hoc ("-"), which Apple Silicon requires to run at all.
      # One platform per build: build-app.sh links in that platform's
      # helper version and SHA-256 (bin/<plat>/app-ldflags from prepare-resources.sh).
      # MYGO_UPDATER_PRIVATE_KEY signs the update archives and manifests
      # (docs/updates.md of mygo); GH_TOKEN lets mygo read the published
      # releases for delta updates.
      - name: Build app and disk images
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/build-app.sh darwin arm64
          scripts/build-app.sh darwin amd64

      # The helper inside each bundle must be the exact file whose SHA-256
      # was linked into the app, or TUN install refuses it.
      - name: Check bundled helper hash
        run: |
          for arch in arm64 amd64; do
            want="$(sed -n 's/.*ExpectedHelperSHA256=\([0-9a-f]*\).*/\1/p' "bin/darwin-${arch}/app-ldflags")"
            got="$(shasum -a 256 build/darwin-${arch}/*.app/Contents/Resources/lanflow-helper | cut -d' ' -f1)"
            echo "darwin/${arch}: linked ${want}, bundled ${got}"
            [ -n "$want" ] && [ "$want" = "$got" ]
          done

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp build/darwin-arm64/*.dmg build/darwin-amd64/*.dmg dist/
          mkdir -p dist/updates
          for d in build/darwin-arm64 build/darwin-amd64; do
            cp "$d"/*.tar.gz "$d"/update-*.json dist/updates/
            cp "$d"/*.delta dist/updates/ 2>/dev/null || true
          done
          go version -m build resources > dist/lanflow-macos-buildinfo.txt
          ls -la dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lanflow-macos
          path: dist/*
          if-no-files-found: error

  build-windows:
    name: Build Windows
    needs: validate
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Vet
        run: |
          go vet ./...
          go tool mygo vet .

      - name: Test
        env:
          CGO_ENABLED: "0"
        run: go test ./...

      - name: Prepare resources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/prepare-resources.sh windows amd64

      # mygo uses a makensis it finds (PATH or Program Files\NSIS, which the
      # runner image provides) and otherwise downloads NSIS 3.13 and checks
      # it against the SHA-256 pinned in mygo itself. Log which one is used.
      - name: Show NSIS
        run: |
          if command -v makensis >/dev/null 2>&1; then makensis -VERSION; echo
          elif [ -x "/c/Program Files (x86)/NSIS/makensis.exe" ]; then "/c/Program Files (x86)/NSIS/makensis.exe" -VERSION; echo
          else echo "no NSIS on the runner; mygo downloads its pinned NSIS"; fi

      - name: Build app and installer
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/build-app.sh windows amd64

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find build -maxdepth 2 -name '*-setup-*.exe' -exec cp {} dist/ \;
          mkdir -p dist/updates
          find build -maxdepth 2 \( -name '*.tar.gz' -o -name '*.delta' -o -name 'update-*.json' \) -exec cp {} dist/updates/ \;
          ls dist/updates/update-windows-*.json >/dev/null
          ls dist/*-setup-*.exe >/dev/null
          go version -m build resources > dist/lanflow-windows-buildinfo.txt
          ls -la dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lanflow-windows
          path: dist/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write     # create the release and upload assets
      id-token: write     # OIDC token for the Sigstore signature
      attestations: write # store the build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: src

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      # SPDX SBOM of the Go module graph the release was built from.
      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: src
          format: spdx-json
          output-file: artifacts/lanflow-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # The update manifests go up last (below): an app that reads one finds
      # every file it names already there.
      - name: Separate update manifests
        run: |
          mv artifacts/updates/update-*.json .
          mv artifacts/updates/* artifacts/
          rmdir artifacts/updates
          ls update-darwin-arm64.json update-darwin-amd64.json update-windows-amd64.json

      - name: Generate SHA-256 checksums
        working-directory: artifacts
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: artifacts/SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: 澜流 Lanflow ${{ github.ref_name }}
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      # Installed apps read update-<platform>.json of the latest release
      # (mygo.json "updates"); publishing them makes the update live.
      - name: Publish update manifests
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: update-*.json
          fail_on_unmatched_files: true
